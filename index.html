<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#12111a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MEMO">
<link rel="manifest" href="./manifest.json">
<title>MEMO</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#12111a;--surface:#1e1d2a;--surface2:#272538;--surface3:#302e44;
  --border:#302e44;--border2:#3d3a56;
  --text:#e8e6f5;--muted:#6e6a90;--muted2:#9d99c0;
  --prism-green:#4caf7d;--prism-blue:#5b9bd5;--prism-orange:#e8834a;
  --prism-purple:#9c6fdb;--prism-yellow:#e8c94a;--prism-red:#e05c6e;
  --shadow:0 4px 24px rgba(0,0,0,.5);
  --note-red:#4a1a1a;--note-yellow:#3a3000;--note-green:#0f2a18;--note-blue:#0a1e3a;
}
html,body{height:100%;overflow:hidden}
body{font-family:'Segoe UI',Meiryo,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column}
header{flex-shrink:0;background:var(--surface);padding:0 16px;height:50px;display:flex;align-items:center;gap:10px;border-bottom:3px solid transparent;border-image:linear-gradient(90deg,#4caf7d,#5b9bd5,#9c6fdb,#e8834a) 1}
.logo{font-size:1.1rem;font-weight:700;letter-spacing:.16em;color:var(--muted2)}
.ver{font-size:.62rem;color:var(--muted);white-space:nowrap;flex:1}
.storage-bar{font-size:.68rem;color:var(--muted);display:flex;align-items:center;gap:5px;white-space:nowrap}
.storage-bar .bar{width:48px;height:4px;background:var(--surface3);border-radius:2px;overflow:hidden}
.storage-bar .bar-fill{height:100%;border-radius:2px;background:var(--prism-green);transition:width .3s}
.storage-bar.warn .bar-fill{background:var(--prism-yellow)}
.storage-bar.danger .bar-fill{background:var(--prism-red)}
.storage-bar.warn .pct{color:var(--prism-yellow)}
.storage-bar.danger .pct{color:var(--prism-red)}
.hbtn{background:var(--surface2);border:1px solid var(--border2);color:var(--muted2);padding:5px 11px;border-radius:6px;cursor:pointer;font-size:.73rem;letter-spacing:.06em;font-weight:600;transition:.15s}
.hbtn:hover{border-color:var(--prism-blue);color:var(--prism-blue)}
.tabs{flex-shrink:0;display:flex;background:#0e0d16;gap:2px;padding:6px 10px 0;border-bottom:1px solid var(--border)}
.tab{padding:7px 14px;color:var(--muted);cursor:pointer;font-size:.75rem;letter-spacing:.07em;font-weight:600;border-radius:6px 6px 0 0;transition:.15s;white-space:nowrap;border:1px solid transparent;border-bottom:none}
.tab:hover{color:var(--muted2);background:var(--surface)}
.tab.active{color:var(--text);background:var(--surface);border-color:var(--border2);box-shadow:inset 0 -3px 0 var(--prism-blue)}
.badge{border-radius:5px;padding:1px 6px;font-size:.65rem;margin-left:4px;font-weight:700}
.tab.active .badge{background:var(--prism-blue);color:#fff}
.tab:not(.active) .badge{background:var(--surface3);color:var(--muted2)}
.badge.gray{background:var(--surface3);color:var(--muted2)}
.layout{flex:1;overflow:hidden;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;padding:14px 16px}
main::-webkit-scrollbar{width:4px}
main::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.toolbar{display:flex;gap:8px;margin-bottom:14px;align-items:center}
.add-btn{background:none;color:var(--prism-green);border:1px solid rgba(76,175,125,.45);padding:7px 16px;border-radius:7px;cursor:pointer;font-size:.8rem;font-weight:600;letter-spacing:.06em;transition:.15s;white-space:nowrap}
.add-btn:hover{border-color:var(--prism-green);background:rgba(76,175,125,.08)}
.add-btn:hover{filter:brightness(1.15);transform:translateY(-1px)}
.search-wrap{flex:1;position:relative}
.search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search-box{width:100%;padding:7px 10px 7px 30px;border:1px solid var(--border2);border-radius:7px;font-size:.82rem;outline:none;background:var(--surface);color:var(--text);transition:.15s}
.search-box:focus{border-color:var(--prism-blue);background:var(--surface2)}
.icon-btn{background:var(--surface2);border:1px solid var(--border2);color:var(--muted2);padding:7px 10px;border-radius:7px;cursor:pointer;font-size:.8rem;transition:.15s}
.icon-btn:hover{border-color:var(--prism-purple);color:var(--prism-purple)}
.icon-btn.active{background:var(--surface3);border-color:var(--prism-purple);color:var(--prism-purple)}
.notes-grid{display:grid;gap:10px}
.notes-grid.normal{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.notes-grid.compact{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px}

/* カード — ランダムボーダーなし、背景色で区別 */
.note{border-radius:8px;padding:12px 13px;background:var(--surface);border:1px solid var(--border2);border-left:3px solid var(--prism-blue);transition:border-color .15s,transform .15s,box-shadow .15s;display:flex;flex-direction:column;cursor:pointer;user-select:none;min-height:90px}
.note:hover{box-shadow:0 0 0 1px rgba(91,155,213,.2),0 6px 20px rgba(0,0,0,.4);transform:translateY(-2px)}
.note.pinned{border-color:rgba(232,201,74,.4)}
.note.pinned:hover{border-color:var(--prism-yellow)}
.note.dragging{opacity:.3;transform:scale(.94)}
.note.drag-over{box-shadow:0 0 0 2px var(--prism-green)}
/* 背景色 */
.note.bg-red{background:var(--note-red);border-color:#6a2a2a}
.note.bg-yellow{background:var(--note-yellow);border-color:#5a4800}
.note.bg-green{background:var(--note-green);border-color:#1a4a28}
.note.bg-blue{background:var(--note-blue);border-color:#1a3a5a}

.note-meta{display:flex;align-items:center;gap:5px;margin-bottom:5px}
.note-date{font-size:.65rem;color:var(--muted);flex:1;font-family:monospace}
.pin-dot{width:7px;height:7px;border-radius:2px;background:var(--prism-yellow);flex-shrink:0}
.arc-badge{font-size:.6rem;background:var(--surface3);color:var(--muted2);border-radius:4px;padding:1px 5px;border:1px solid var(--border2);display:inline-flex;align-items:center;gap:2px}
.arc-badge svg{vertical-align:middle}
.note-title{font-size:.85rem;font-weight:700;color:#fff;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-body{font-size:.8rem;line-height:1.5;color:var(--muted2);word-break:break-word;white-space:pre-wrap;flex:1;overflow:hidden;max-height:80px}
.compact .note{padding:8px 10px;min-height:unset}
.compact .note-body{font-size:.77rem;max-height:52px}
.section-label{font-size:.67rem;color:var(--muted);margin:4px 0 8px;letter-spacing:.1em;font-weight:700;display:flex;align-items:center;gap:8px;grid-column:1/-1}
.section-label::before{content:'';width:8px;height:8px;border-radius:2px;background:var(--prism-yellow);flex-shrink:0}
.section-label::after{content:'';flex:1;height:1px;background:var(--border2)}
.empty{text-align:center;color:var(--muted);padding:48px 20px;font-size:.85rem;grid-column:1/-1;line-height:2.2}
.arc-header{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.arc-header h2{font-size:.78rem;letter-spacing:.1em;font-weight:700;color:var(--muted2);border-bottom:2px solid var(--prism-blue);padding-bottom:6px;display:inline-block}
.arc-cnt{background:var(--prism-red);color:#fff;border-radius:5px;padding:1px 7px;font-size:.68rem;font-weight:700}
.trash-info{font-size:.75rem;color:var(--muted);margin-bottom:12px;padding:8px 12px;background:var(--surface);border-radius:7px;border:1px solid var(--border);line-height:1.7}

/* EDIT OVERLAY */
.edit-overlay{display:none;position:fixed;inset:0;background:rgba(6,5,14,.82);backdrop-filter:blur(6px);z-index:100;align-items:center;justify-content:center;padding:12px}
.edit-overlay.show{display:flex}
.edit-panel{background:var(--surface);border:1px solid var(--border2);border-top:3px solid var(--prism-blue);border-radius:10px;width:100%;max-width:560px;height:calc(100vh - 24px);box-shadow:0 20px 60px rgba(0,0,0,.7);display:flex;flex-direction:column;overflow:hidden}
.edit-top{flex-shrink:0;padding:12px 14px 0;display:flex;align-items:center;gap:8px}
.edit-label{font-size:.68rem;letter-spacing:.12em;font-weight:700;color:var(--muted);flex:1}
.edit-save-btn{background:none;color:var(--prism-green);border:1px solid rgba(76,175,125,.45);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:.76rem;font-weight:600;flex-shrink:0;transition:.15s}
.edit-save-btn:hover{border-color:var(--prism-green);background:rgba(76,175,125,.08)}
.edit-save-btn:active{filter:brightness(.9)}
.edit-top-btns{display:flex;gap:6px;flex-shrink:0}
.edit-cancel-btn{background:none;color:var(--muted2);border:1px solid var(--border2);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:.76rem;font-weight:700;flex-shrink:0}
.edit-cancel-btn:active{background:var(--surface3)}
.edit-close{background:none;border:1px solid var(--border2);color:var(--muted2);cursor:pointer;font-size:.72rem;padding:4px 10px;border-radius:5px;transition:.15s;font-weight:600}
.edit-close:hover{background:var(--surface3);color:var(--text)}
.edit-textarea{flex:1;width:100%;min-height:0;padding:13px 16px;border:none;background:transparent;color:var(--text);font-size:.93rem;line-height:1.75;font-family:inherit;resize:none;outline:none;overflow-y:auto}
.edit-textarea::-webkit-scrollbar{width:4px}
.edit-textarea::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.edit-textarea::placeholder{color:var(--muted)}
.edit-hint{flex-shrink:0;padding:4px 14px 6px;font-size:.67rem;color:var(--muted);letter-spacing:.04em}
.edit-actions{flex-shrink:0;padding:10px 14px;border-top:1px solid var(--border);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.ea-btn{border:1px solid var(--border2);background:var(--surface2);color:var(--muted2);padding:6px 11px;border-radius:6px;cursor:pointer;font-size:.74rem;font-weight:600;transition:.15s;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.ea-btn svg,.edit-save-btn svg,.edit-cancel-btn svg,.hbtn svg,.icon-btn svg{vertical-align:middle;flex-shrink:0}
.ea-btn:hover{background:var(--surface3)}
.ea-btn.pin{border-color:rgba(232,201,74,.4);color:var(--prism-yellow)}
.ea-btn.pin:hover{background:rgba(232,201,74,.1)}
.ea-btn.arc{border-color:rgba(91,155,213,.4);color:var(--prism-blue)}
.ea-btn.arc:hover{background:rgba(91,155,213,.1)}
.ea-btn.del{border-color:rgba(224,92,110,.4);color:var(--prism-red)}
.ea-btn.del:hover{background:rgba(224,92,110,.1)}

/* 背景色選択 */
.color-picker{display:flex;gap:5px;align-items:center}
.cp-dot{width:20px;height:20px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:.15s;flex-shrink:0}
.cp-dot:hover{transform:scale(1.2)}
.cp-dot.active{border-color:#fff;transform:scale(1.2)}
.cp-dot.none{background:var(--surface3);border-color:var(--border2)}
.cp-dot.red{background:#7a2020}
.cp-dot.yellow{background:#6b5500}
.cp-dot.green{background:#1a5c2a}
.cp-dot.blue{background:#1a4a8a}
.color-filter-bar{display:flex;gap:8px;align-items:center;padding:2px 2px 10px;flex-wrap:wrap}
.cf-dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--border2);cursor:pointer;transition:.15s;flex-shrink:0}
.cf-dot:hover{transform:scale(1.15)}
.cf-dot.active{border-color:#fff;box-shadow:0 0 0 2px var(--prism-blue)}
.cf-dot.none{background:var(--surface3)}
.cf-dot.red{background:#7a2020}
.cf-dot.yellow{background:#6b5500}
.cf-dot.green{background:#1a5c2a}
.cf-dot.blue{background:#1a4a8a}

.overlay{display:none;position:fixed;inset:0;background:rgba(6,5,14,.85);backdrop-filter:blur(6px);z-index:200;align-items:center;justify-content:center;padding:20px}
.overlay.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--border2);border-top:3px solid var(--prism-red);border-radius:10px;padding:20px;width:100%;max-width:300px;box-shadow:var(--shadow)}
.modal h3{font-size:.88rem;margin-bottom:9px;letter-spacing:.06em;font-weight:700}
.confirm-msg{font-size:.82rem;line-height:1.7;color:var(--muted2);margin-bottom:14px}
.modal-btns{display:flex;gap:8px;justify-content:flex-end}
.btn-cancel{background:var(--surface2);border:1px solid var(--border2);color:var(--muted2);padding:6px 13px;border-radius:6px;cursor:pointer;font-size:.78rem;font-weight:600}
.btn-del{background:var(--prism-red);color:#fff;border:none;padding:6px 15px;border-radius:6px;cursor:pointer;font-size:.78rem;font-weight:700}

/* AI校正overlay */


#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface2);color:var(--text);padding:9px 14px;border-radius:8px;font-size:.78rem;box-shadow:var(--shadow);display:none;align-items:center;gap:10px;z-index:300;border:1px solid var(--border2);white-space:nowrap}
#toast.show{display:flex}
#toast-undo{background:var(--prism-blue);border:none;color:#fff;padding:4px 10px;border-radius:5px;cursor:pointer;font-size:.73rem;font-weight:700}
#install-banner{display:none;background:var(--surface2);border:1px solid rgba(91,155,213,.35);border-radius:8px;padding:9px 13px;margin-bottom:12px;font-size:.77rem;align-items:center;gap:10px;color:var(--muted2)}
#install-banner.show{display:flex}
#install-btn{background:var(--prism-blue);color:#fff;border:none;padding:4px 11px;border-radius:5px;cursor:pointer;font-size:.73rem;font-weight:700}
#install-dismiss{background:none;border:none;color:var(--muted);cursor:pointer;margin-left:auto;font-size:.9rem}

/* ロック画面 */
#lock-screen{position:fixed;inset:0;background:var(--bg);z-index:500;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px}
#lock-screen.hide{display:none}
.lock-logo{font-size:1.5rem;font-weight:700;letter-spacing:.18em;color:var(--muted2)}
.lock-icon{color:var(--muted);margin-bottom:2px}
.lock-box{display:flex;flex-direction:column;gap:10px;align-items:center;width:240px}
#lock-input{width:100%;padding:11px 14px;border:1px solid var(--border2);border-radius:8px;font-size:.95rem;background:var(--surface);color:var(--text);outline:none;text-align:center;letter-spacing:.1em}
#lock-input:focus{border-color:var(--prism-blue)}
.lock-btn{width:100%;background:var(--prism-blue);color:#fff;border:none;padding:10px;border-radius:8px;cursor:pointer;font-size:.85rem;font-weight:700;letter-spacing:.05em}
.lock-btn:hover{filter:brightness(1.15)}
.lock-err{color:var(--prism-red);font-size:.75rem;min-height:1em}
.lock-setup-link{color:var(--muted);font-size:.7rem;cursor:pointer;text-decoration:underline;background:none;border:none}
.lock-setup-link:hover{color:var(--muted2)}
</style>
</head>
<body>

<div id="lock-screen">
  <svg class="lock-icon" width="30" height="30" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="10" height="7" rx="1.5"/><path d="M6 8V5.5a3 3 0 0 1 6 0V8"/></svg>
  <span class="lock-logo">MEMO</span>
  <div class="lock-box" id="lock-box-enter" style="display:none">
    <input type="password" id="lock-input" placeholder="パスワード" autocomplete="off">
    <button class="lock-btn" onclick="tryUnlock()">ロック解除</button>
    <span class="lock-err" id="lock-err"></span>
  </div>
  <div class="lock-box" id="lock-box-setup">
    <span style="font-size:.78rem;color:var(--muted2)">パスワードを設定してください</span>
    <input type="password" id="lock-new1" placeholder="新しいパスワード" autocomplete="off">
    <input type="password" id="lock-new2" placeholder="確認のため再入力" autocomplete="off">
    <button class="lock-btn" onclick="setupLock()">設定する</button>
    <span class="lock-err" id="lock-setup-err"></span>
    <button class="lock-setup-link" onclick="skipLock()">設定しない</button>
  </div>
</div>

<header>
  <span class="logo">MEMO</span>
  <div class="storage-bar" id="storage-bar">
    <div class="bar"><div class="bar-fill" id="bar-fill" style="width:0%"></div></div>
    <span class="pct" id="bar-pct">0%</span>
  </div>
  <button class="hbtn" onclick="exportJSON()">EXPORT</button>
  <label class="hbtn" style="cursor:pointer">IMPORT<input type="file" accept=".json" onchange="importJSON(event)" style="display:none"></label>
  <button class="hbtn" onclick="lockNow()"><svg width="14" height="14" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="10" height="7" rx="1.5"/><path d="M6 8V5.5a3 3 0 0 1 6 0V8"/></svg></button>
</header>
<div class="tabs">
  <div class="tab active" onclick="switchTab('notes')" id="tab-notes">NOTES <span class="badge" id="badge-notes">0</span></div>
  <div class="tab" onclick="switchTab('archive')" id="tab-archive">ARCHIVE <span class="badge" id="badge-archive">0</span></div>
  <div class="tab" onclick="switchTab('trash')" id="tab-trash">TRASH <span class="badge gray" id="badge-trash">0</span></div>
</div>
<div class="layout">
<main>
  <div id="install-banner">
    <span>ホーム画面に追加してオフラインでも使えます</span>
    <button id="install-btn" onclick="installPWA()">インストール</button>
    <button id="install-dismiss" onclick="document.getElementById('install-banner').classList.remove('show')"><svg width="12" height="12" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="4" y1="4" x2="14" y2="14"/><line x1="14" y1="4" x2="4" y2="14"/></svg></button>
  </div>
  <div id="pane-notes">
    <div class="toolbar">
      <button class="add-btn" onclick="openNew()">＋ NEW</button>
      <div class="search-wrap">
        <span class="search-icon"><svg width="13" height="13" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="7.5" cy="7.5" r="5"/><line x1="11.5" y1="11.5" x2="15" y2="15"/></svg></span>
        <input class="search-box" id="search-notes" type="search" placeholder="Search…" oninput="renderNotes()">
      </div>
      <button class="icon-btn" id="compact-btn" onclick="toggleCompact()"></button>
    </div>
    <div class="color-filter-bar" id="colorfilter-notes"></div>
    <div id="notes-grid" class="notes-grid normal"></div>
  </div>
  <div id="pane-archive" style="display:none">
    <div class="toolbar">
      <div class="arc-header" style="flex:1"><h2>ARCHIVE</h2><span class="arc-cnt" id="arc-cnt">0</span></div>
      <div class="search-wrap">
        <span class="search-icon"><svg width="13" height="13" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="7.5" cy="7.5" r="5"/><line x1="11.5" y1="11.5" x2="15" y2="15"/></svg></span>
        <input class="search-box" id="search-archive" type="search" placeholder="Search…" oninput="renderArchive()">
      </div>
    </div>
    <div class="color-filter-bar" id="colorfilter-archive"></div>
    <div id="archive-grid" class="notes-grid normal"></div>
  </div>
  <div id="pane-trash" style="display:none">
    <div class="trash-info">削除したメモは <strong>30秒間</strong> ここに残ります。</div>
    <div id="trash-grid" class="notes-grid normal"></div>
  </div>
</main>
</div>

<!-- EDIT OVERLAY -->
<div class="edit-overlay" id="edit-overlay">
  <div class="edit-panel" id="edit-panel">
    <div class="edit-top">
      <span class="edit-label" id="edit-title-label">NEW NOTE</span>
      <div class="edit-top-btns" id="edit-top-btns"></div>
    </div>
    <textarea class="edit-textarea" id="edit-textarea" placeholder="1行目がタイトルになります…"></textarea>
    <div class="edit-hint" id="edit-hint">1行目 = タイトル　／　Ctrl+Enter または「✓ 保存」で保存して閉じる</div>
    <div class="edit-actions" id="edit-actions"></div>
  </div>
</div>

<!-- confirm delete -->
<div class="overlay" id="modal-del">
  <div class="modal">
    <h3>TRASH</h3>
    <p class="confirm-msg">ゴミ箱に移しますか？<br>30秒以内なら元に戻せます。</p>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal('modal-del')">キャンセル</button>
      <button class="btn-del" onclick="confirmDelete()">移動</button>
    </div>
  </div>
</div>

<div id="toast"><span id="toast-msg"></span><button id="toast-undo" onclick="undoTrash()">元に戻す</button></div>

<script>
let notes=[], trash=[], editId=null, deleteId=null, compact=false, currentTab='notes';
let trashTimers={}, toastTimer=null, deferredPrompt=null;
// ===== 線画アイコン(Claude風シンプルアイコン) =====
const ICON_PATHS={
  check:'<polyline points="4 10 8 14 16 5"/>',

const COLORS=['none','red','yellow','green','blue'];
let colorLabels={}; // {color:{name,updated}}
try{colorLabels=JSON.parse(localStorage.getItem('sn3_color_labels')||'{}');}catch(e){colorLabels={};}
function saveColorLabels(){try{localStorage.setItem('sn3_color_labels',JSON.stringify(colorLabels));}catch(e){}}
function colorName(c){return(colorLabels[c]&&colorLabels[c].name)||({none:'なし',red:'赤',yellow:'黄',green:'緑',blue:'青'})[c];}
let filterColor={notes:null,archive:null};
function renameColor(color){
  const cur=(colorLabels[color]&&colorLabels[color].name)||'';
  const name=prompt(`「${({none:'なし',red:'赤',yellow:'黄',green:'緑',blue:'青'})[color]}」の分類名を入力（空欄でリセット）`,cur);
  if(name===null)return;
  const trimmed=name.trim();
  if(trimmed)colorLabels[color]={name:trimmed,updated:Date.now()};else{delete colorLabels[color];colorLabels[color]={name:'',updated:Date.now()};}
  saveColorLabels();renderAll();renderColorFilters();schedulePushColors();
}
let pressTimer=null;
function bindLongPress(el,color){
  const start=()=>{pressTimer=setTimeout(()=>renameColor(color),550);};
  const cancel=()=>{clearTimeout(pressTimer);};
  el.addEventListener('mousedown',start);el.addEventListener('touchstart',start,{passive:true});
  el.addEventListener('mouseup',cancel);el.addEventListener('mouseleave',cancel);el.addEventListener('touchend',cancel);el.addEventListener('touchmove',cancel);
}
function colorFilterHTML(tab){
  return COLORS.map(c=>`<div class="cf-dot ${c}${filterColor[tab]===c?' active':''}" data-color="${c}" data-tab="${tab}" title="${colorName(c)}"></div>`).join('');
}
function renderColorFilters(){
  ['notes','archive'].forEach(tab=>{
    const el=document.getElementById('colorfilter-'+tab);
    if(!el)return;
    el.innerHTML=colorFilterHTML(tab);
    el.querySelectorAll('.cf-dot').forEach(dot=>{
      const color=dot.dataset.color;
      dot.addEventListener('click',()=>{
        filterColor[tab]=filterColor[tab]===color?null:color;
        renderColorFilters();
        if(tab==='notes')renderNotes();else renderArchive();
      });
      bindLongPress(dot,color);
    });
  });
}

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function fmtDate(ts){if(!ts)return'';const d=new Date(ts);return`${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`}

// ===== ロック =====
async function sha256(str){const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('')}
function initLock(){
  const hash=localStorage.getItem('memo_lock_hash');
  if(hash){document.getElementById('lock-box-setup').style.display='none';document.getElementById('lock-box-enter').style.display='flex';setTimeout(()=>document.getElementById('lock-input').focus(),100);}
  else{document.getElementById('lock-box-setup').style.display='flex';document.getElementById('lock-box-enter').style.display='none';}
}
async function tryUnlock(){
  const input=document.getElementById('lock-input').value;
  const hash=localStorage.getItem('memo_lock_hash');
  if(await sha256(input)===hash){document.getElementById('lock-screen').classList.add('hide');document.getElementById('lock-input').value='';document.getElementById('lock-err').textContent='';syncOnUnlock();}
  else{document.getElementById('lock-err').textContent='パスワードが違います';document.getElementById('lock-input').value='';document.getElementById('lock-input').focus();}
}
async function setupLock(){
  const p1=document.getElementById('lock-new1').value,p2=document.getElementById('lock-new2').value;
  if(!p1){document.getElementById('lock-setup-err').textContent='パスワードを入力してください';return}
  if(p1!==p2){document.getElementById('lock-setup-err').textContent='パスワードが一致しません';return}
  localStorage.setItem('memo_lock_hash',await sha256(p1));
  document.getElementById('lock-screen').classList.add('hide');
  syncOnUnlock();
}
function skipLock(){document.getElementById('lock-screen').classList.add('hide')}
function lockNow(){document.getElementById('lock-screen').classList.remove('hide');initLock()}
initLock();

// 背景色ピッカーHTML
function colorPickerHTML(currentBg){
  return`<div class="color-picker">`+COLORS.map(c=>`<div class="cp-dot ${c}${currentBg===c?' active':''}" title="${colorName(c)}" onclick="setBgColor('${c}')"></div>`).join('')+`</div>`;
}

function buildActions(n,isArc,isTrsh){
  let acts='';
  if(!isArc&&!isTrsh&&n){
    acts+=colorPickerHTML(n.bg||'none');
    acts+=`<button class="ea-btn pin" onclick="togglePin('${n.id}')">${n.pinned?ic('pinOff')+' 解除':ic('pin')+' ピン'}</button>`;
    acts+=`<button class="ea-btn arc" onclick="archiveNote('${n.id}')">${ic('archive')} 保存</button>`;
    acts+=`<button class="ea-btn del" onclick="deleteFromEdit('${n.id}')">${ic('trash')} 削除</button>`;
  } else if(!isArc&&!isTrsh&&!n){
    acts+=colorPickerHTML('none');
    acts+=`<button class="ea-btn pin" onclick="saveAndPin()">${ic('pin')} ピンで保存</button>`;
    acts+=`<button class="ea-btn arc" onclick="saveAndArchive()">${ic('archive')} アーカイブで保存</button>`;
    acts+=`<button class="ea-btn del" onclick="discardNew()">${ic('trash')} 破棄</button>`;
  } else if(isArc&&n){
    acts+=colorPickerHTML(n.bg||'none');
    acts+=`<button class="ea-btn arc" onclick="unarchiveNote('${n.id}')">${ic('undo')} 戻す</button>`;
    acts+=`<button class="ea-btn del" onclick="deleteFromEdit('${n.id}')">${ic('trash')} 削除</button>`;
  } else if(isTrsh&&n){
    acts+=`<button class="ea-btn arc" onclick="restoreFromTrash('${n.id}');forceCloseEdit()">${ic('undo')} 復元</button>`;
    acts+=`<button class="ea-btn del" onclick="permDelete('${n.id}');forceCloseEdit()">${ic('x')} 完全削除</button>`;
  }
  acts+=`<button class="ea-btn" style="border-color:rgba(156,111,219,.4);color:var(--prism-purple)" onclick="openCompanyAI()">${ic('sparkle')} AI連携</button>`;
  return acts;
}

function closeEdit(save=true){

}
function forceCloseEdit(){document.getElementById('edit-overlay').classList.remove('show');editId=null;delete document.querySelector('.edit-panel').dataset.bg;}

    const n=[...notes,...trash].find(x=>x.id===editId);

  editId=id;

  const isArc=nn.archived,isTrsh=!!nn.trashedAt&&!notes.find(x=>x.id===id);
  document.getElementById('edit-title-label').textContent='EDIT NOTE';
  document.getElementById('edit-textarea').value=nn.text||'';
  document.querySelector('.edit-panel').style.borderTopColor='var(--prism-blue)';
  document.querySelector('.edit-panel').dataset.bg=nn.bg||'none';
  document.getElementById('edit-top-btns').innerHTML=topButtonsHTML(true);

  document.getElementById('edit-actions').innerHTML=buildActions(nn,isArc,isTrsh);
  document.getElementById('edit-overlay').classList.add('show');

function closeModal(id){document.getElementById(id).classList.remove('show')}

function _commitSave(){
  const txt=document.getElementById('edit-textarea').value.trim();if(!txt)return;
  const bg=getCurrentBg();
  if(editId){
    const n=[...notes,...trash].find(x=>x.id===editId);
    if(n){n.text=txt;n.updated=Date.now();n.bg=bg;}
  } else {
    notes.unshift({id:uid(),text:txt,bg,created:Date.now(),updated:Date.now(),archived:false,pinned:false});
  }
  persist();renderAll();
}
function saveAndPin(){
  const txt=document.getElementById('edit-textarea').value.trim();if(!txt)return;
  notes.unshift({id:uid(),text:txt,bg:getCurrentBg(),created:Date.now(),updated:Date.now(),archived:false,pinned:true});
  forceCloseEdit();persist();renderAll();showToast('ピン留めで保存しました');
}
function saveAndArchive(){
  const txt=document.getElementById('edit-textarea').value.trim();if(!txt)return;
  notes.unshift({id:uid(),text:txt,bg:getCurrentBg(),created:Date.now(),updated:Date.now(),archived:true,archivedAt:Date.now(),pinned:false});
  forceCloseEdit();persist();renderAll();showToast('アーカイブで保存しました');
}
function discardNew(){document.getElementById('edit-textarea').value='';forceCloseEdit();showToast('破棄しました');}

function togglePin(id){const n=notes.find(x=>x.id===id);if(!n)return;_commitSave();n.pinned=!n.pinned;persist();renderAll();forceCloseEdit();}
function archiveNote(id){_commitSave();const n=notes.find(x=>x.id===id);if(!n)return;n.archived=true;n.archivedAt=Date.now();persist();renderAll();forceCloseEdit();}
function unarchiveNote(id){_commitSave();const n=notes.find(x=>x.id===id);if(!n)return;n.archived=false;delete n.archivedAt;persist();renderAll();forceCloseEdit();}
function deleteFromEdit(id){document.getElementById('edit-overlay').classList.remove('show');editId=null;deleteId=id;document.getElementById('modal-del').classList.add('show');}
function askDelete(id){deleteId=id;document.getElementById('modal-del').classList.add('show')}
function confirmDelete(){
  const n=notes.find(x=>x.id===deleteId);if(!n){closeModal('modal-del');return}
  notes=notes.filter(x=>x.id!==deleteId);
  trash.push({...n,trashedAt:Date.now()});
  clearTimeout(trashTimers[deleteId]);
  trashTimers[deleteId]=setTimeout(()=>{markDeleted(deleteId);trash=trash.filter(x=>x.id!==deleteId);if(currentTab==='trash')renderTrash();updateBadges();persist();},30000);
  closeModal('modal-del');persist();renderAll();showToast('ゴミ箱に移しました');
}
function restoreFromTrash(id){
  const n=trash.find(x=>x.id===id);if(!n)return;
  clearTimeout(trashTimers[id]);delete trashTimers[id];
  trash=trash.filter(x=>x.id!==id);n.archived=false;delete n.trashedAt;
  notes.unshift(n);persist();renderAll();
}
function undoTrash(){if(deleteId)restoreFromTrash(deleteId);hideToast()}
function permDelete(id){clearTimeout(trashTimers[id]);markDeleted(id);trash=trash.filter(x=>x.id!==id);persist();renderTrash();updateBadges();}

function copyNote(){
  const txt=document.getElementById('edit-textarea').value;if(!txt)return;
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(()=>showToast('コピーしました')).catch(()=>fallbackCopy(txt));}
  else fallbackCopy(txt);
}
function fallbackCopy(txt){
  const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.focus();ta.select();
  try{document.execCommand('copy');showToast('コピーしました');}catch(e){showToast('コピー失敗');}
  document.body.removeChild(ta);
}

// ===== 端末間同期 =====
const SYNC_URL='https://memo-sync.ksey-fgljfsmg7475219t.workers.dev';
let pendingDeletes=[]; // 完全削除の墓標（次回同期時にサーバーへ伝える）
let syncing=false;

function getSyncToken(){return localStorage.getItem('memo_lock_hash');}

function rowToLocal(r){
  return{id:r.id,text:r.text,bg:r.bg||'none',created:r.created,updated:r.updated,
    archived:!!r.archived,archivedAt:r.archivedAt||undefined,
    pinned:!!r.pinned,trashedAt:r.trashedAt||undefined};
}

function mergeServerRows(rows){
  const map=new Map([...notes,...trash].map(n=>[n.id,n]));
  for(const r of rows){
    if(r.deleted){map.delete(r.id);continue;}
    const local=map.get(r.id);
    const remoteTs=Math.max(r.updated||0,r.trashedAt||0);
    const localTs=local?Math.max(local.updated||0,local.trashedAt||0):-1;
    if(!local||remoteTs>localTs)map.set(r.id,rowToLocal(r));
  }
  const merged=[...map.values()];
  notes=merged.filter(n=>!n.trashedAt);
  trash=merged.filter(n=>!!n.trashedAt);
  trash.forEach(n=>{
    if(trashTimers[n.id])return;
    const rem=30000-(Date.now()-(n.trashedAt||0));
    if(rem>0)trashTimers[n.id]=setTimeout(()=>{trash=trash.filter(x=>x.id!==n.id);if(currentTab==='trash')renderTrash();updateBadges();persist(false);},rem);
    else trash=trash.filter(x=>x.id!==n.id);
  });
}

async function syncPull(){
  const token=getSyncToken();if(!token)return;
  try{
    const res=await fetch(SYNC_URL+'/notes',{headers:{'X-App-Token':token}});
    if(!res.ok)return;
    const rows=await res.json();
    mergeServerRows(rows);
    persist(false);renderAll();
  }catch(e){/* オフライン等は無視 */}
}

async function syncPush(){
  const token=getSyncToken();if(!token)return;
  if(syncing)return;syncing=true;
  const payload=[...notes,...trash].map(n=>({
    id:n.id,text:n.text,bg:n.bg||'none',created:n.created,updated:n.updated,
    archived:n.archived?1:0,archivedAt:n.archivedAt||null,
    pinned:n.pinned?1:0,trashedAt:n.trashedAt||null,deleted:0
  }));
  const tombstones=pendingDeletes.map(d=>({
    id:d.id,text:'',bg:'none',created:d.updated,updated:d.updated,
    archived:0,archivedAt:null,pinned:0,trashedAt:null,deleted:1
  }));
  try{
    await fetch(SYNC_URL+'/notes/sync',{method:'POST',headers:{'Content-Type':'application/json','X-App-Token':token},body:JSON.stringify({notes:[...payload,...tombstones]})});
    pendingDeletes=[];
  }catch(e){/* オフライン等は無視、次回同期時に再送 */}
  syncing=false;
}

let pushTimer=null;
function schedulePush(){clearTimeout(pushTimer);pushTimer=setTimeout(syncPush,500);}
function markDeleted(id){pendingDeletes.push({id,updated:Date.now()});schedulePush();}

// ===== 色ラベルの同期 =====
async function syncColorsPull(){
  const token=getSyncToken();if(!token)return;
  try{
    const res=await fetch(SYNC_URL+'/colors',{headers:{'X-App-Token':token}});
    if(!res.ok)return;
    const rows=await res.json();
    let changed=false;
    for(const r of rows){
      const local=colorLabels[r.color];
      if(!local||(r.updated||0)>(local.updated||0)){
        colorLabels[r.color]={name:r.name||'',updated:r.updated||0};
        changed=true;
      }
    }
    if(changed){saveColorLabels();renderAll();renderColorFilters();}
  }catch(e){/* オフライン等は無視 */}
}
let colorSyncing=false;
async function syncColorsPush(){
  const token=getSyncToken();if(!token)return;
  if(colorSyncing)return;colorSyncing=true;
  const payload=COLORS.filter(c=>colorLabels[c]).map(c=>({color:c,name:colorLabels[c].name||'',updated:colorLabels[c].updated||Date.now()}));
  if(payload.length){
    try{
      await fetch(SYNC_URL+'/colors/sync',{method:'POST',headers:{'Content-Type':'application/json','X-App-Token':token},body:JSON.stringify({colors:payload})});
    }catch(e){/* オフライン等は無視 */}
  }
  colorSyncing=false;
}
let colorPushTimer=null;
function schedulePushColors(){clearTimeout(colorPushTimer);colorPushTimer=setTimeout(syncColorsPush,500);}

async function syncOnUnlock(){await syncPull();await syncColorsPull();await syncPush();await syncColorsPush();}

let dragId=null;
function onDragStart(e,id){dragId=id;setTimeout(()=>document.querySelector(`[data-id="${id}"]`)?.classList.add('dragging'),0)}
function onDragEnd(e,id){document.querySelector(`[data-id="${id}"]`)?.classList.remove('dragging');dragId=null}
function onDragOver(e,id){e.preventDefault();document.querySelectorAll('.note').forEach(x=>x.classList.remove('drag-over'));document.querySelector(`[data-id="${id}"]`)?.classList.add('drag-over')}
function onDrop(e,toId){
  e.preventDefault();document.querySelectorAll('.note').forEach(x=>x.classList.remove('drag-over'));
  if(!dragId||dragId===toId)return;
  const fi=notes.findIndex(x=>x.id===dragId),ti=notes.findIndex(x=>x.id===toId);
  if(fi<0||ti<0)return;
  const [item]=notes.splice(fi,1);notes.splice(ti,0,item);persist();renderNotes();
}

function makeCard(n,opts={}){
  const {isArc=false,isTrsh=false}=opts;
  const lines=(n.text||'').split('\n');
  const title=lines[0].replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const body=lines.slice(1).join('\n').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const ts=fmtDate(isArc?n.archivedAt:isTrsh?n.trashedAt:n.updated);
  let extra='';
  if(isTrsh){const rem=Math.max(0,Math.round((30000-(Date.now()-(n.trashedAt||0)))/1000));extra=`<span class="arc-badge">${ic('clock',11)}${rem}s</span>`;}
  else if(isArc){extra=`<span class="arc-badge">archived</span>`;}
  const drag=(!isArc&&!isTrsh)?`draggable="true" ondragstart="onDragStart(event,'${n.id}')" ondragend="onDragEnd(event,'${n.id}')" ondragover="onDragOver(event,'${n.id}')" ondrop="onDrop(event,'${n.id}')"`:''
  const pin=n.pinned&&!isArc&&!isTrsh?`<span class="pin-dot"></span>`:'';
  const bgClass=n.bg&&n.bg!=='none'?` bg-${n.bg}`:'';
  return`<div class="note${n.pinned&&!isArc&&!isTrsh?' pinned':''}${bgClass}" data-id="${n.id}" ${drag} onclick="openEdit('${n.id}')">
    <div class="note-meta">${pin}<span class="note-date">${ts}</span>${extra}</div>
    ${title?`<div class="note-title">${title}</div>`:''}
    ${body?`<div class="note-body">${body}</div>`:''}
  </div>`;
}

function renderNotes(){
  const q=document.getElementById('search-notes').value.trim().toLowerCase();
  const fc=filterColor.notes;
  const active=notes.filter(n=>!n.archived&&(!q||(n.text||'').toLowerCase().includes(q))&&(!fc||(n.bg||'none')===fc));
  const pinned=active.filter(n=>n.pinned),unpinned=active.filter(n=>!n.pinned);
  let html='';
  if(pinned.length)html+=`<div class="section-label">PINNED</div>${pinned.map(n=>makeCard(n)).join('')}`;
  if(unpinned.length)html+=(pinned.length?`<div class="section-label">NOTES</div>`:'')+unpinned.map(n=>makeCard(n)).join('');
  if(!html)html=`<div class="empty">No notes yet<br><span style="font-size:.75rem;color:var(--muted)">＋ NEW をクリックして追加</span></div>`;
  document.getElementById('notes-grid').innerHTML=html;updateBadges();
}
function renderArchive(){
  const q=document.getElementById('search-archive').value.trim().toLowerCase();
  const fc=filterColor.archive;
  const list=notes.filter(n=>n.archived&&(!q||(n.text||'').toLowerCase().includes(q))&&(!fc||(n.bg||'none')===fc));
  document.getElementById('archive-grid').innerHTML=list.length?list.map(n=>makeCard(n,{isArc:true})).join(''):`<div class="empty">No archived notes</div>`;
  document.getElementById('arc-cnt').textContent=list.length;updateBadges();
}
function renderTrash(){
  const list=[...trash].sort((a,b)=>b.trashedAt-a.trashedAt);
  document.getElementById('trash-grid').innerHTML=list.length?list.map(n=>makeCard(n,{isTrsh:true})).join(''):`<div class="empty">Trash is empty</div>`;
  updateBadges();
}
function updateBadges(){
  document.getElementById('badge-notes').textContent=notes.filter(n=>!n.archived).length;
  document.getElementById('badge-archive').textContent=notes.filter(n=>n.archived).length;
  document.getElementById('badge-trash').textContent=trash.length;
}
function renderAll(){renderNotes();if(currentTab==='archive')renderArchive();else if(currentTab==='trash')renderTrash();}

function updateStorage(){
  try{
    const used=new Blob([localStorage.getItem('sn3_notes')||'',localStorage.getItem('sn3_trash')||'']).size;
    const pct=Math.min(100,Math.round(used/(5*1024*1024)*100));
    const bar=document.getElementById('storage-bar');
    document.getElementById('bar-fill').style.width=pct+'%';
    document.getElementById('bar-pct').textContent=pct+'%';
    bar.className='storage-bar'+(pct>=95?' danger':pct>=80?' warn':'');
  }catch(e){}
}
function persist(push=true){try{localStorage.setItem('sn3_notes',JSON.stringify(notes));localStorage.setItem('sn3_trash',JSON.stringify(trash));updateStorage();}catch(e){}if(push)schedulePush();}
function load(){
  try{
    const n=localStorage.getItem('sn3_notes'),t=localStorage.getItem('sn3_trash');
    if(n)notes=JSON.parse(n);
    if(t){trash=JSON.parse(t);trash.forEach(n=>{const rem=30000-(Date.now()-(n.trashedAt||0));if(rem>0){trashTimers[n.id]=setTimeout(()=>{markDeleted(n.id);trash=trash.filter(x=>x.id!==n.id);if(currentTab==='trash')renderTrash();updateBadges();persist();},rem)}else trash=trash.filter(x=>x.id!==n.id);})}
  }catch(e){}
}
function exportJSON(){const blob=new Blob([JSON.stringify({notes,trash},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`memo_${new Date().toISOString().slice(0,10)}.json`;a.click();}
function importJSON(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(d.notes&&Array.isArray(d.notes)){notes=d.notes;trash=d.trash||[];persist();renderAll();alert(`${notes.length}件読み込みました`)}else if(Array.isArray(d)){notes=d;trash=[];persist();renderAll();alert(`${d.length}件読み込みました`)}else alert('形式が正しくありません')}catch{alert('読み込みに失敗しました')}};r.readAsText(f);}


// 外クリックで保存して閉じる（ドラッグ誤作動防止）
let _mouseDownTarget=null;
document.getElementById('edit-overlay').addEventListener('mousedown',e=>{_mouseDownTarget=e.target;});
document.getElementById('edit-overlay').addEventListener('click',e=>{
  if(e.target===document.getElementById('edit-overlay')&&_mouseDownTarget===document.getElementById('edit-overlay'))closeEdit(true);
});

document.addEventListener('keydown',e=>{
  if(e.ctrlKey&&e.key==='n'&&!document.getElementById('edit-overlay').classList.contains('show')){e.preventDefault();openNew()}
  if(e.key==='Escape'){closeEdit(true);closeModal('modal-del')}
});
document.getElementById('edit-textarea').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();closeEdit(true)}
});
document.addEventListener('DOMContentLoaded',()=>{
  const li=document.getElementById('lock-input');if(li)li.addEventListener('keydown',e=>{if(e.key==='Enter')tryUnlock();});
  const n2=document.getElementById('lock-new2');if(n2)n2.addEventListener('keydown',e=>{if(e.key==='Enter')setupLock();});
});

setInterval(()=>{if(currentTab==='trash'&&trash.length)renderTrash();},4000);
document.getElementById('compact-btn').innerHTML=ic('grid');
renderColorFilters();load();renderAll();updateStorage();
</script>
</body>
</html>
